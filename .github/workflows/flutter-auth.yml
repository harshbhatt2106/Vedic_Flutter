name: Flutter authentication checks

on:
  push:
    branches: [flutter-development]
  pull_request:
    branches: [flutter-development]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter create --platforms=android --no-pub .
      - run: flutter build apk --debug --verbose
